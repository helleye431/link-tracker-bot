services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka1
    hostname: kafka1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN



  kafka2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka2
    hostname: kafka2
    depends_on:
      - zookeeper
    ports:
      - "29093:29093"
      - "9102:9102"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  kafka3:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka3
    hostname: kafka3
    depends_on:
      - zookeeper
    ports:
      - "29094:29094"
      - "9103:9103"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2


      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  kafka-migrate:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-migrate
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    restart: "no"
    command: |
      bash -c '
        echo "Waiting for Kafka cluster..."
        cub kafka-ready -b kafka1:9092 3 60
      
        echo "Creating topic: notifications + dlq"
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --create --if-not-exists --topic link.raw_updates --partitions 1 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config cleanup.policy=delete
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --create --if-not-exists --topic link.raw_updates.dlq --partitions 1 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --create --if-not-exists --topic link.processed_updates --partitions 1 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config cleanup.policy=delete
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --create --if-not-exists --topic link.processed_updates.dlq --partitions 1 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config cleanup.policy=delete
        echo "Kafka migrations completed."
      '

  schema-registry:
    image: confluentinc/cp-schema-registry:7.3.2
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-migrate:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-zookeeper-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  postgres:
    image: postgres:16
    container_name: postgres-service
    environment:
      POSTGRES_DB: scrapper_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scrapper_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-service
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey-node-0:
    image: bitnamilegacy/valkey-cluster:8.1.3
    container_name: valkey-node-0
    hostname: valkey-node-0
    ports:
      - "9000:6379"
    volumes:
      - valkey-cluster_data-0:/bitnami/valkey/data
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      VALKEY_NODES: valkey-node-0 valkey-node-1 valkey-node-2
    restart: unless-stopped

  valkey-node-1:
    image: bitnamilegacy/valkey-cluster:8.1.3
    container_name: valkey-node-1
    hostname: valkey-node-1
    ports:
      - "9001:6379"
    volumes:
      - valkey-cluster_data-1:/bitnami/valkey/data
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      VALKEY_NODES: valkey-node-0 valkey-node-1 valkey-node-2
    restart: unless-stopped

  valkey-node-2:
    image: bitnamilegacy/valkey-cluster:8.1.3
    container_name: valkey-node-2
    hostname: valkey-node-2
    ports:
      - "9002:6379"
    volumes:
      - valkey-cluster_data-2:/bitnami/valkey/data
    depends_on:
      - valkey-node-0
      - valkey-node-1
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      VALKEY_CLUSTER_REPLICAS: 0
      VALKEY_NODES: valkey-node-0 valkey-node-1 valkey-node-2
      VALKEY_CLUSTER_CREATOR: "yes"
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    hostname: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight_data:/data
    depends_on:
      - valkey-node-0
      - valkey-node-1
      - valkey-node-2
    restart: unless-stopped

  bot:
    build:
      context: ./project-bot-service
      dockerfile: Dockerfile
    container_name: bot-service
    env_file:
      - ./project-bot-service/.env
    environment:
      metrics_host: 0.0.0.0
      metrics_port: 8011
      scrapper_grpc_target: scrapper_service:50051
      bot_grpc_host: 0.0.0.0
      bot_grpc_port: 50052
      scrapper_url: http://scrapper:8080
      bot_url: http://0.0.0.0:8000

      kafka_bootstrap_servers: kafka1:9092,kafka2:9092,kafka3:9092
      schema_registry_url: http://schema-registry:8081
    ports:
      - "8000:8000"
      - "50052:50052"
      - "8011:8011"
    depends_on:
      scrapper:
        condition: service_started
      kafka-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      valkey-node-2:
        condition: service_started
    restart: unless-stopped

  scrapper:
    build:
      context: ./project-scrapper-service
      dockerfile: Dockerfile
    container_name: scrapper_service
    env_file:
      - ./project-scrapper-service/.env
    environment:
      valkey_addresses: valkey-node-0:6379,valkey-node-1:6379,valkey-node-2:6379
      bot_grpc_target: bot:50052
      scrapper_grpc_host: 0.0.0.0
      scrapper_grpc_port: 50051
      bot_http_url: http://bot:8000
      scrapper_http_url: http://0.0.0.0:8080

      db_host: postgres
      db_port: 5432
      db_name: scrapper_db
      db_user: postgres
      db_pass: postgres

      kafka_bootstrap_servers: kafka1:9092,kafka2:9092,kafka3:9092
      schema_registry_url: http://schema-registry:8081
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-migrate:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./project-ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    env_file:
      - ./project-ai-service/.env
    volumes:
      - ./project-ai-service/processing_config.yml:/app/processing_config.yml:ro
    environment:
      kafka_bootstrap_servers: kafka1:9092,kafka2:9092,kafka3:9092
      schema_registry_url: http://schema-registry:8081
    ports:
      - '8100:8100'
    depends_on:
      kafka-migrate:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.36.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    depends_on:
      - bot
      - scrapper
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  valkey-cluster_data-0:
    driver: local
  valkey-cluster_data-1:
    driver: local
  valkey-cluster_data-2:
    driver: local
  redis-insight_data:
    driver: local
  prom-data:
    driver: local
  grafana-data:
    driver: local