[tool.poetry]
name = "backend-academy-2026-python-template"
version = "0.1.0"
description = ""
package-mode = false
authors = ["g.tarasov <g.tarasov@tbank.ru>"]
readme = "README.md"
packages = [{ include = "scrapper_service", from = "src" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry.dependencies]
python =  ">=3.12,<3.13"
fastapi = "^0.135.1"
uvicorn = "^0.41.0"
httpx = "^0.28.1"
structlog = "^25.5.0"
poetry-core = "^2.3.1"
pydantic-settings = "^2.13.1"
pydantic = "^2.12.5"
grpcio = "^1.78.0"
grpcio-tools = "^1.78.0"
alembic = "^1.18.4"
sqlalchemy = "^2.0.49"
asyncpg = "^0.31.0"
testcontainers = "^4.14.2"
psycopg = {version = "^3.3.3", extras = ["binary"]}
greenlet = "^3.3.2"
wiremock = "^2.7.0"
confluent-kafka = {extras = ["avro", "schemaregistry"], version = "^2.14.0"}
valkey-glide = "^2.3.1"
types-cachetools = "^7.0.0.20260503"
tenacity = "^9.1.4"
aiomisc = "^18.0.21"
slowapi = "^0.1.9"
prometheusrock = "^0.2.0"
prometheus-client = "^0.25.0"


[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.1"
pytest = "*"
pytest-cov = "*"
pytest-deadfixtures = "*"
pytest-mock = "*"
pytest-repeat = "*"
pytest-asyncio = "*"
mypy = "^1.19.1"



[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
#Расскомментируйте следующую строку, если используете Pydantic
plugins = ['pydantic.mypy']
allow_redefinition = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
exclude = "^(.*/)?test_[\\w]*\\.py$|conftest\\.py|tests"

[tool.ruff]
target-version = "py312"